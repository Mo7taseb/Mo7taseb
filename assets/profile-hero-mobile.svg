<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 536" role="img" aria-labelledby="title description">
  <title id="title">Momen Almohtaseb — full-stack software engineer</title>
  <desc id="description">Mobile portrait banner introducing Momen and his selected products: VocTap, Sanad Engine, and Techno ERP.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1519"/>
      <stop offset="1" stop-color="#101d22"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#6aa293" stroke-opacity=".075"/>
    </pattern>
    <style>
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; }
      .sans { font-family: 'Segoe UI', 'Inter', Arial, sans-serif; }
      .appear { animation: appear .7s ease-out both; }
      .a2 { animation-delay: .17s; }
      .a3 { animation-delay: .34s; }
      @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .appear { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="478" height="534" rx="18" fill="url(#surface)" stroke="#426158" stroke-width="2"/>
  <rect x="2" y="2" width="476" height="532" rx="17" fill="url(#grid)"/>
  <circle cx="435" cy="10" r="115" fill="#50b8c1" opacity=".05"/>
  <g class="appear">
    <rect x="28" y="28" width="10" height="10" rx="2" fill="#91efb6"/>
    <text x="48" y="37" fill="#9ec8b4" font-size="12" letter-spacing="1.7" class="mono">MOMEN / ENGINEERING</text>
    <path d="M28 56H452" stroke="#36564f"/>
  </g>
  <g class="appear a2">
    <text x="28" y="94" fill="#82cdb1" font-size="11" letter-spacing="2.3" class="mono">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="26" y="137" fill="#f2f7f3" font-size="32" font-weight="700" class="sans">Momen Almohtaseb</text>
    <rect x="28" y="153" width="57" height="3" rx="1.5" fill="#8ce8ba"/>
    <text x="28" y="185" fill="#bfd3cb" font-size="15" class="sans">I turn product ideas into usable software —</text>
    <text x="28" y="207" fill="#bfd3cb" font-size="15" class="sans">from interface to API, data, and delivery.</text>
    <circle cx="33" cy="241" r="4" fill="#a7f7bd"/>
    <text x="47" y="246" fill="#c9edd8" font-size="13" class="mono">Bethlehem, Palestine</text>
    <text x="28" y="271" fill="#82ac9d" font-size="11" class="mono">REACT · TYPESCRIPT · PYTHON · JAVA</text>
  </g>
  <path d="M28 297H452" stroke="#36564f"/>
  <g class="appear a3">
    <text x="28" y="328" fill="#82cdb1" font-size="12" letter-spacing="2" class="mono">SELECTED BUILDS</text>
    <path d="M47 353V477" stroke="#5bd3bc" stroke-width="2"/>
    <circle cx="47" cy="361" r="5" fill="#a7f7bd"/>
    <text x="65" y="365" fill="#f2f7f3" font-size="17" font-weight="650" class="sans">VocTap</text>
    <text x="65" y="384" fill="#94b8aa" font-size="12" class="sans">Language learning in context</text>
    <circle cx="47" cy="418" r="5" fill="#6ce0c5"/>
    <text x="65" y="422" fill="#f2f7f3" font-size="17" font-weight="650" class="sans">Sanad Engine</text>
    <text x="65" y="441" fill="#94b8aa" font-size="12" class="sans">IT operations and device management</text>
    <circle cx="47" cy="475" r="5" fill="#7bb7d2"/>
    <text x="65" y="479" fill="#f2f7f3" font-size="17" font-weight="650" class="sans">Techno ERP</text>
    <text x="65" y="498" fill="#94b8aa" font-size="12" class="sans">Multi-tenant business operations</text>
  </g>
</svg>
